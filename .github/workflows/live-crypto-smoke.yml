name: live-crypto-smoke

on:
  push:
    paths:
      - .github/workflows/live-crypto-smoke.yml
  workflow_dispatch:

# End-to-end live API + disposable Postgres proof. No production data is touched.
jobs:
  uniswap-pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jarvis
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/jarvis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run migrate
      - run: npm run crypto:pipeline-smoke
