name: live-crypto-smoke

on:
  push:
    paths:
      - .github/workflows/live-crypto-smoke.yml

jobs:
  uniswap-fees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run crypto:uni
