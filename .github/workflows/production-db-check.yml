name: production-db-check

on:
  workflow_dispatch:

jobs:
  verify-production-postgres:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Require Railway database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "RAILWAY_DATABASE_URL GitHub Actions secret is not configured."
            exit 2
          fi
      - run: npm run db:check
